<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Thank you for contacting CACPE.">
    <title>Thank You | CACPE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --background: #f7faf8;
            --surface: #fff;
            --text: #425249;
            --heading: #10251a;
            --green: #0b6b3a;
            --green-light: #e8f3ed;
            --border: rgba(16, 37, 26, 0.1);
        }

        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            background: var(--background);
            color: var(--text);
            font-family: "DM Sans", sans-serif;
            line-height: 1.65;
        }
        body.dark-mode {
            color-scheme: dark;
            --background: #0c1b12;
            --surface: #14281c;
            --text: #c3d4c8;
            --heading: #eff8f2;
            --green: #79d49e;
            --green-light: #183b28;
            --border: rgba(224, 245, 231, 0.14);
        }
        a { color: inherit; text-decoration: none; }
        button { font: inherit; }
        :focus-visible { outline: 3px solid #d6a54a; outline-offset: 4px; }
        .container { width: min(92%, 1200px); margin-inline: auto; }
        .site-header { background: #064527; color: #fff; }
        .header-inner { min-height: 86px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo img { width: 52px; height: 52px; object-fit: contain; }
        .logo-text { display: flex; flex-direction: column; line-height: 1; }
        .logo-name { font-size: 1.45rem; font-weight: 700; letter-spacing: -0.5px; }
        .logo-tagline { margin-top: 5px; color: rgba(255,255,255,0.75); font-size: 0.62rem; letter-spacing: 0.6px; }
        .header-home { color: rgba(255,255,255,0.9); font-size: 0.9rem; font-weight: 700; }
        .header-home:hover { color: #e9c57d; }
        main {
            flex: 1;
            display: grid;
            place-items: center;
            padding: 80px 0;
            background: linear-gradient(180deg, rgba(6,69,39,0.08), transparent 70%);
        }
        .thank-you-card {
            width: min(100%, 720px);
            margin-inline: auto;
            padding: clamp(32px, 7vw, 72px);
            border: 1px solid var(--border);
            border-top: 4px solid var(--green);
            background: var(--surface);
            box-shadow: 0 15px 50px rgba(10,40,24,0.1);
            text-align: center;
        }
        .icon {
            display: grid;
            place-items: center;
            width: 70px;
            height: 70px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: var(--green-light);
            color: var(--green);
        }
        .icon svg { width: 32px; height: 32px; }
        .eyebrow {
            color: var(--green);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.8px;
            text-transform: uppercase;
        }
        h1 {
            margin: 15px 0 20px;
            color: var(--heading);
            font: 700 clamp(2.4rem, 6vw, 4rem)/1.15 "Playfair Display", serif;
        }
        .thank-you-card p { max-width: 500px; margin: 0 auto 28px; }
        .home-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 52px;
            padding: 13px 22px;
            background: #d6a54a;
            color: #10251a;
            font-weight: 700;
            transition: background 0.2s ease, transform 0.2s ease;
        }
        .home-button:hover { background: #e6bb69; transform: translateY(-2px); }
        .home-button svg { width: 18px; height: 18px; }
        footer { padding: 25px 0; background: #10251a; color: rgba(255,255,255,0.75); text-align: center; font-size: 0.8rem; }
        .theme-toggle {
            position: fixed;
            right: 20px;
            bottom: 20px;
            min-height: 44px;
            padding: 10px 15px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--surface);
            color: var(--heading);
            box-shadow: 0 8px 30px rgba(10,40,24,0.1);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
        }
        @media (max-width: 600px) {
            .header-inner { min-height: 74px; }
            .logo img { width: 44px; height: 44px; }
            main { padding: 50px 0 80px; }
            footer { padding-bottom: 80px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .home-button { transition: none; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="logo" href="index.html" aria-label="CACPE home">
                <img src="logo.png" alt="">
                <span class="logo-text">
                    <span class="logo-name">CACPE</span>
                    <span class="logo-tagline">CLIMATE &bull; EDUCATION &bull; ACTION</span>
                </span>
            </a>
            <a class="header-home" href="index.html">Home</a>
        </div>
    </header>

    <main>
        <div class="container">
            <section class="thank-you-card">
                <div class="icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"></path></svg>
                </div>
                <div class="eyebrow">Message submitted</div>
                <h1>Thank You for Reaching Out.</h1>
                <p>Thank you for connecting with CACPE. We appreciate your interest in our work and look forward to connecting with you.</p>
                <a class="home-button" href="index.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
                    Back to homepage
                </a>
            </section>
        </div>
    </main>

    <footer><div class="container">&copy; CACPE. All rights reserved.</div></footer>
    <button class="theme-toggle" type="button">Dark mode</button>
    <script src="theme.js"></script>
</body>
</html>
